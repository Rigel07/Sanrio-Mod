name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ordenar archivos en sus carpetas (por si se subieron sueltos)
        run: |
          J=src/main/java/com/sanriofriends
          place() {
            if [ -f "$1" ]; then mkdir -p "$2"; mv "$1" "$2/"; echo "movido $1 -> $2/"; fi
          }
          for f in Quests Dialogue Lines FriendData; do place $f.java $J/dialogue; done
          place QuestEvents.java $J/event
          place SanrioCharacter.java $J
          place SanrioFriends.java $J
          place PlushBlock.java $J/block
          place SanrioCommands.java $J/command
          place CharmItem.java $J/item
          for f in ModItems ModTabs ModEntities ModBlocks; do place $f.java $J/registry; done
          for f in ClientSetup SanrioRenderer SanrioModel; do place $f.java $J/client; done
          for f in SanrioEntity CinnamorollEntity; do place $f.java $J/entity; done
          place mods.toml src/main/resources/META-INF
          place pack.mcmeta src/main/resources
          for f in data generate_all parts structures textures; do place $f.py tools; done

      - name: Comprobar que el codigo esta en el repositorio
        run: |
          echo "Archivos en la raiz:"; ls -la
          test -f build.gradle || { echo "ERROR: no hay build.gradle en la raiz del repositorio"; exit 1; }
          test -d src/main/java || { echo "ERROR: falta la carpeta src/main/java"; exit 1; }
          echo "Archivos .java encontrados: $(find src/main/java -name '*.java' | wc -l)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generar texturas, modelos, recetas y estructuras
        run: |
          pip install pillow
          python3 tools/generate_all.py
          echo "Archivos de recursos generados: $(find src/main/resources -type f | wc -l)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.1.1

      - name: Compilar el mod
        run: gradle build --no-daemon --stacktrace

      - name: Verificar que el .jar tiene el mod dentro
        run: |
          ls -la build/libs
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          echo "Revisando $JAR"
          unzip -l "$JAR" | grep -q 'META-INF/mods.toml' || { echo "ERROR: el jar no contiene mods.toml"; exit 1; }
          unzip -l "$JAR" | grep -q 'com/sanriofriends/SanrioFriends.class' || { echo "ERROR: el jar no contiene clases compiladas"; exit 1; }
          echo "OK: el jar contiene el mod"

      - name: Subir el .jar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: sanrio-friends
          path: build/libs/*.jar

      - name: Publicar release (solo con tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
